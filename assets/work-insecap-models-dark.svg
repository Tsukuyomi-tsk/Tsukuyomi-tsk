<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Diagram: sales and quotes feed three offline models. A sales close forecast using mm3_drift, with a MAPE of 11.8 percent against 12.6 percent for the best baseline. A payments model, a Random Forest, with a late payment AUC-PR of 0.46, 15.7 times chance. A client risk model with four axes, with a churn AUC-PR of 0.89 against 0.78 for the existing rule. The payment score is reused by the client risk model. The outputs are CSV and JSON tables that the KPI API reads and serves to a dashboard with management and sales executive views."><title>Diagram: sales and quotes feed three offline models. A sales close forecast using mm3_drift, with a MAPE of 11.8 percent against 12.6 percent for the best baseline. A payments model, a Random Forest, with a late payment AUC-PR of 0.46, 15.7 times chance. A client risk model with four axes, with a churn AUC-PR of 0.89 against 0.78 for the existing rule. The payment score is reused by the client risk model. The outputs are CSV and JSON tables that the KPI API reads and serves to a dashboard with management and sales executive views.</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.loop{animation:loop 16s infinite}@keyframes loop{0%,95%{opacity:1}98%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}.twinkle{animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{opacity:.35}}.bar{transform-box:fill-box;transform-origin:bottom}.cover{transform-box:fill-box;transform-origin:right}@keyframes k0{0%,2.50%{opacity:0}4.06%,100%{opacity:1}}.k0{animation:k0 16s  infinite}@keyframes k1{0%,5.62%{op