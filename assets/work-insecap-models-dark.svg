"30" y="354" font-size="11" text-anchor="start" fill="#e6edf3">each model beat the alternatives in a rolling-origin backtest: simple won, and was kept</text></g><g class="k29"><text x="30" y="374" font-size="11" text-anchor="start" fill="#8b949e">batch, not live inference: the API only reads tables that were computed offline</text></g><text x="850" y="392" font-size="9" text-anchor="end" fill="#8b949e">sample values</text></svg>